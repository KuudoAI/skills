name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Python for portable skill tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check synchronized release versions
        run: npm run version:check
      - name: Require a version bump for every changed skill
        if: github.event_name == 'pull_request'
        run: npm run skills:version-check -- --base origin/${{ github.base_ref }}
      - name: Require Conventional Commits for release notes
        if: github.event_name == 'pull_request'
        run: npm run commits:check -- --base origin/${{ github.base_ref }}
      - name: Audit dependencies
        run: npm audit --audit-level=high
