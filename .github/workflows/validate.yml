name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check synchronized release versions
        run: npm run version:check
      - name: Require a version bump for every changed skill
        if: github.event_name == 'pull_request'
        run: npm run skills:version-check -- --base origin/${{ github.base_ref }}
      - name: Require Conventional Commits for release notes
        if: github.event_name == 'pull_request'
        run: npm run commits:check -- --base origin/${{ github.base_ref }}
      - name: Audit dependencies
        run: npm audit --audit-level=high
