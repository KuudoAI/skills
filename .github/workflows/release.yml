name: Release

# release-please keeps a release pull request open that bumps the synchronized
# plugin version and prepends RELEASE-NOTES.md from Conventional Commits.
# Merging that pull request tags vX.Y.Z and publishes the GitHub release.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # No dependency cache in the release workflow: a poisoned cache must not
        # reach a run that can tag releases.
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate the commit on main
        run: npm test
      - name: Check synchronized release versions
        run: npm run version:check

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pull requests opened with the default GITHUB_TOKEN do not trigger other
      # workflows, so required checks never run on the release pull request.
      # A RELEASE_PLEASE_TOKEN secret (fine-grained PAT or GitHub App token with
      # contents and pull-requests write) lets the Validate workflow run there.
      - name: Open or update the release pull request, or publish the release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
