name: Release

# release-please keeps a release pull request open that bumps the synchronized
# plugin version and prepends RELEASE-NOTES.md from Conventional Commits.
# Merging that pull request tags vX.Y.Z and publishes the GitHub release.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate the commit on main
        run: npm test
      - name: Check synchronized release versions
        run: npm run version:check

  release:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      # Pull requests opened with the default GITHUB_TOKEN do not trigger other
      # workflows, so required checks never run on the release pull request.
      # A RELEASE_PLEASE_TOKEN secret (fine-grained PAT or GitHub App token with
      # contents and pull-requests write) lets the Validate workflow run there.
      - name: Open or update the release pull request, or publish the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
