schema_version: "1.1"
name: amazon-ads-audit-routing
tags: [routing, amazon-ads]
execution:
  prompt: Audit my Sponsored Products campaigns.
  max_turns: 6
  timeout_seconds: 120
  allowed_tools: [Skill]
graders:
  - name: auditor-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?amazon-ads-sp-campaign-auditor"'
  - name: selection-announced
    type: regex
    target: trace
    pattern: 'Using (?:kuudo-skills:)?amazon-ads-sp-campaign-auditor to'
